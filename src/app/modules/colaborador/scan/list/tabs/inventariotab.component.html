<div class="flex h-full min-h-0 w-full flex-col overflow-hidden pb-10">
  <!-- header -->
  <div class="flex flex-shrink-0 flex-col gap-2 px-4 sm:px-6">
    <div class="flex items-center justify-between">
      <h3 class="text-sm font-semibold text-black dark:text-white">Sesión actual</h3>
      <button mat-icon-button (click)="limpiarHistorial()" matTooltip="Limpiar sesión">
        <mat-icon class="text-gray-400">delete_sweep</mat-icon>
      </button>
    </div>
  </div>

  <!-- Divisor -->
  <div class="mx-4 border-t border-gray-200 sm:mx-6 dark:border-gray-700"></div>

  <!-- Columnas -->
  <div class="min-h-0 flex-1 overflow-hidden px-4 py-3 sm:px-6">
    <div class="grid h-full grid-cols-2 gap-4 pb-10">
      <!-- Columna: No inventariados -->
      <div class="flex min-h-0 flex-col">
        <div class="mb-2 flex flex-shrink-0 items-center gap-1.5">
          <span class="h-2 w-2 flex-shrink-0 rounded-full bg-green-500"></span>
          <span class="truncate text-xs font-semibold text-gray-600 dark:text-gray-300"
            >No inventariados</span
          >
          <span
            class="ml-auto flex-shrink-0 rounded-full bg-green-50 px-2 py-0.5 text-xs font-bold text-green-700 dark:bg-green-900/30 dark:text-green-400"
          >
            {{ noInventariados.length }}
          </span>
        </div>
        <div
          class="max-h-[30vh] min-h-0 flex-1 overflow-y-auto rounded-lg border border-green-200 bg-green-50/30 sm:max-h-none dark:border-green-900/40 dark:bg-green-900/10"
        >
          <div
            *ngFor="let item of noInventariados"
            class="border-b border-green-100 px-3 py-2 last:border-0 dark:border-green-900/30"
          >
            <p class="font-mono text-xs font-medium text-gray-800 dark:text-gray-200">
              {{ item.codigo }}
            </p>
            <p class="text-[10px] text-gray-400">{{ item.fechaHora | date: 'HH:mm:ss' }}</p>
          </div>
          <div
            *ngIf="noInventariados.length === 0"
            class="flex h-full min-h-[4rem] items-center justify-center py-6"
          >
            <p class="text-xs text-gray-400">Sin registros</p>
          </div>
        </div>
      </div>

      <!-- Columna: Ya inventariados -->
      <div class="flex min-h-0 flex-col">
        <div class="mb-2 flex flex-shrink-0 items-center gap-1.5">
          <span class="h-2 w-2 flex-shrink-0 rounded-full bg-amber-400"></span>
          <span class="truncate text-xs font-semibold text-gray-600 dark:text-gray-300"
            >Ya inventariados</span
          >
          <span
            class="ml-auto flex-shrink-0 rounded-full bg-amber-50 px-2 py-0.5 text-xs font-bold text-amber-700 dark:bg-amber-900/30 dark:text-amber-400"
          >
            {{ yaInventariados.length }}
          </span>
        </div>
        <div
          class="max-h-[30vh] min-h-0 flex-1 overflow-y-auto rounded-lg border border-amber-200 bg-amber-50/30 sm:max-h-none dark:border-amber-900/40 dark:bg-amber-900/10"
        >
          <div
            *ngFor="let item of yaInventariados"
            class="border-b border-amber-100 px-3 py-2 last:border-0 dark:border-amber-900/30"
          >
            <p class="font-mono text-xs font-medium text-gray-800 dark:text-gray-200">
              {{ item.codigo }}
            </p>
            <p class="text-[10px] text-gray-400">{{ item.fechaHora | date: 'HH:mm:ss' }}</p>
          </div>
          <div
            *ngIf="yaInventariados.length === 0"
            class="flex h-full min-h-[4rem] items-center justify-center py-6"
          >
            <p class="text-xs text-gray-400">Sin registros</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
