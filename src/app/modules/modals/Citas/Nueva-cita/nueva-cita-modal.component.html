<!-- modal de pc -->
<div class="bg-card flex hidden h-full flex-col md:block">
  <!-- Header modal -->
  <div
    class="flex shrink-0 items-center justify-between border-b border-gray-200 dark:border-gray-500"
  >
    <h2 class="ml-2 text-lg text-black dark:text-white">
      {{ editandoCita ? 'Editar cita' : 'Nueva cita' }}
    </h2>
    <button
      class="flex h-8 w-8 items-center justify-center rounded-full transition-colors hover:bg-gray-100 dark:hover:bg-gray-500"
      (click)="cerrarModal()"
    >
      <mat-icon class="text-base text-black icon-size-5 dark:text-white">close</mat-icon>
    </button>
  </div>

  <!-- Body modal -->
  <div class="flex flex-1 flex-col gap-4 overflow-y-auto px-1 py-5">
    <!-- Visita -->
    <div class="flex flex-col gap-1">
      <label class="text-sm font-medium text-black dark:text-white">Visitante</label>
      <div class="relative">
        <input
          [(ngModel)]="formCita.paciente"
          placeholder="Nombre completo"
          class="w-full rounded-lg border border-slate-300 py-2.5 pl-3 pr-10 text-sm text-black transition focus:border-accent-500 focus:outline-none focus:ring-2 focus:ring-accent-500 dark:bg-gray-700 dark:text-white"
        />
        <mat-icon
          class="pointer-events-none absolute right-3 top-1/2 -translate-y-1/2 text-sm font-medium text-black icon-size-5 dark:text-white"
        >
          person_outline
        </mat-icon>
      </div>
    </div>

    <!-- Motivo -->
    <div class="flex flex-col gap-1">
      <label class="text-sm font-medium text-black dark:text-white">Motivo de la cita</label>
      <div class="relative">
        <input
          [(ngModel)]="formCita.motivo"
          placeholder="Ej: Consulta general"
          class="w-full rounded-lg border border-slate-300 py-2.5 pl-3 pr-10 text-sm text-black transition focus:border-accent-500 focus:outline-none focus:ring-2 focus:ring-accent-500 dark:bg-gray-700 dark:text-white"
        />
        <mat-icon
          class="pointer-events-none absolute right-3 top-1/2 -translate-y-1/2 text-base text-black icon-size-5 dark:text-white"
          [svgIcon]="'heroicons_outline:assignment'"
        ></mat-icon>
      </div>
    </div>

    <div class="grid grid-cols-2 gap-4">
      <!-- Fecha -->
      <div class="flex flex-col gap-1">
        <label class="text-sm font-medium text-black dark:text-white">Fecha</label>

        <div class="relative">
          <input
            #fechaInput
            type="date"
            [(ngModel)]="formCita.fecha"
            class="w-full rounded-lg border border-slate-300 py-2.5 pl-3 pr-10 text-sm text-black transition focus:border-accent-500 focus:outline-none focus:ring-2 focus:ring-accent-500 dark:bg-gray-700 dark:text-white [&::-webkit-calendar-picker-indicator]:absolute [&::-webkit-calendar-picker-indicator]:right-0 [&::-webkit-calendar-picker-indicator]:h-full [&::-webkit-calendar-picker-indicator]:w-full [&::-webkit-calendar-picker-indicator]:opacity-0"
          />

          <!-- Icono -->
          <mat-icon
            class="absolute right-3 top-1/2 -translate-y-1/2 cursor-pointer text-black icon-size-5 dark:text-white"
            (click)="fechaInput.showPicker()"
          >
            calendar_today
          </mat-icon>
        </div>
      </div>

      <!-- Estado -->
      <div class="flex flex-col gap-1">
        <label class="text-sm font-medium text-black dark:text-white">Estado</label>

        <div class="relative">
          <select
            [(ngModel)]="formCita.estado"
            class="appearance-none w-full cursor-pointer rounded-lg border border-slate-300 py-2.5 pl-3 pr-10 text-sm text-black transition [-moz-appearance:none] [-webkit-appearance:none] focus:border-accent-500 focus:outline-none focus:ring-2 focus:ring-accent-500 dark:bg-gray-700 dark:text-white"
          >
            <option value="confirmada">Confirmada</option>
            <option value="pendiente">Pendiente</option>
            <option value="cancelada">Cancelada</option>
          </select>

          <!-- Icono personalizado (solo este debe verse) -->
          <mat-icon
            class="pointer-events-none absolute right-3 top-1/2 -translate-y-1/2 text-xl text-black icon-size-5 dark:text-white"
          >
            expand_more
          </mat-icon>
        </div>
      </div>
    </div>

    <div class="grid grid-cols-2 gap-4">
      <!-- Hora inicio -->
      <div class="flex flex-col gap-1">
        <label class="text-sm font-medium text-black dark:text-white">Hora inicio</label>

        <div class="relative">
          <input
            #horaInicioInput
            type="time"
            [(ngModel)]="formCita.horaInicio"
            class="w-full rounded-lg border border-slate-300 py-2.5 pl-3 pr-10 text-sm text-black transition focus:border-accent-500 focus:outline-none focus:ring-2 focus:ring-accent-500 dark:bg-gray-700 dark:text-white [&::-webkit-calendar-picker-indicator]:absolute [&::-webkit-calendar-picker-indicator]:right-0 [&::-webkit-calendar-picker-indicator]:h-full [&::-webkit-calendar-picker-indicator]:w-full [&::-webkit-calendar-picker-indicator]:opacity-0"
            style="appearance: none; -webkit-appearance: none; -moz-appearance: none"
          />

          <!-- Icono -->
          <mat-icon
            class="absolute right-3 top-1/2 -translate-y-1/2 cursor-pointer text-black icon-size-5 dark:text-white"
            (click)="horaInicioInput.showPicker()"
          >
            schedule
          </mat-icon>
        </div>
      </div>

      <!-- Hora fin -->
      <div class="flex flex-col gap-1">
        <label class="text-sm font-medium text-black dark:text-white">Hora fin</label>

        <div class="relative">
          <input
            #horaFinInput
            type="time"
            [(ngModel)]="formCita.horaFin"
            class="w-full rounded-lg border border-slate-300 py-2.5 pl-3 pr-10 text-sm text-black transition focus:border-accent-500 focus:outline-none focus:ring-2 focus:ring-accent-500 dark:bg-gray-700 dark:text-white [&::-webkit-calendar-picker-indicator]:absolute [&::-webkit-calendar-picker-indicator]:right-0 [&::-webkit-calendar-picker-indicator]:h-full [&::-webkit-calendar-picker-indicator]:w-full [&::-webkit-calendar-picker-indicator]:opacity-0"
            style="appearance: none; -webkit-appearance: none; -moz-appearance: none"
          />

          <!-- Icono -->
          <mat-icon
            class="absolute right-3 top-1/2 -translate-y-1/2 cursor-pointer text-black icon-size-5 dark:text-white"
            (click)="horaFinInput.showPicker()"
          >
            schedule
          </mat-icon>
        </div>
      </div>
    </div>

    <!-- Notas -->
    <div class="flex flex-col gap-1">
      <label class="text-sm font-medium text-black dark:text-white">Notas adicionales</label>
      <textarea
        [(ngModel)]="formCita.notas"
        rows="3"
        placeholder="Observaciones..."
        class="w-full resize-none rounded-lg border border-slate-300 px-3 py-2.5 text-sm text-black transition focus:border-accent-500 focus:outline-none focus:ring-2 focus:ring-accent-500 dark:bg-gray-700 dark:text-white"
      ></textarea>
    </div>
  </div>

  <!-- Footer modal -->
  <div class="flex shrink-0 justify-end gap-3 border-t border-gray-200 dark:border-gray-500">
    <button
      class="mt-2 rounded-lg border border-slate-300 px-4 py-2 text-sm font-medium text-black transition-colors hover:bg-slate-50 dark:text-white"
      (click)="cerrarModal()"
    >
      Cancelar
    </button>
    <button
      class="mr-2 mt-2 inline-flex items-center gap-1 rounded-lg bg-primary-600 px-4 py-2 text-sm text-white shadow-sm transition-colors hover:bg-primary-700"
      (click)="guardarCita()"
    >
      <mat-icon class="text-base leading-none text-white icon-size-5">save</mat-icon>
      {{ editandoCita ? 'Actualizar' : 'Guardar' }}
    </button>
  </div>
</div>

<!-- modal de movil  -->
<div
  class="fixed inset-0 z-50 flex items-end justify-center bg-black/70 md:hidden md:items-center"
  (click)="cerrarModal()"
>
  <!-- Bottom Sheet -->

  <div
    class="bg-card flex max-h-[92dvh] w-full max-w-md flex-col overflow-hidden rounded-t-3xl border border-gray-400 shadow-2xl"
    [class.select-none]="isDragging"
    [style.transform]="dragTransform"
    [style.transition]="dragTransition"
    (click)="$event.stopPropagation()"
    [@slideUp]
  >
    <div class="bg-default dark:bg-card"
      [class.select-none]="isDragging"
    [style.transform]="dragTransform"
    [style.transition]="dragTransition"
    (click)="$event.stopPropagation()"
    [@slideUp]>
      <!-- Drag Handle -->
      <div
        class="flex cursor-grab justify-center pb-2 pt-3 active:cursor-grabbing"
        (touchstart)="onTouchStart($event)"
        (touchmove)="onTouchMove($event)"
        (touchend)="onTouchEnd($event)"
      >
        <div
          class="h-1.5 w-11 rounded-full bg-gray-400 transition-colors active:bg-primary-500 dark:bg-white/20"
        ></div>
      </div>

      <!-- Header -->
      <div class="flex items-center justify-between border-b border-white/10 px-5 pb-4">
        <div class="flex items-center gap-3">
          <div
            class="flex h-10 w-10 items-center justify-center rounded-2xl border border-primary-500/30 bg-primary-500/10"
          >
            <mat-icon
              class="text-2xl text-primary-500 dark:text-accent-500"
              [svgIcon]="
                editandoCita
                  ? 'heroicons_outline:edit_calendar'
                  : 'heroicons_outline:calendar_add_on'
              "
            >
            </mat-icon>
          </div>
          <div>
            <h2 class="text-lg font-semibold tracking-tight text-black dark:text-white">
              {{ editandoCita ? 'Editar cita' : 'Nueva cita' }}
            </h2>
            <p class="text-sm text-primary-400">{{ formCita.fecha || 'Selecciona fecha' }}</p>
          </div>
        </div>

        <button
          (click)="cerrarModal()"
          class="flex h-9 w-9 items-center justify-center rounded-full text-primary-400 transition-colors hover:bg-white/10 hover:text-white"
        >
          <mat-icon>close</mat-icon>
        </button>
      </div>
    </div>
    <!-- Body -->
    <div class="flex-1 space-y-6 overflow-auto p-5 pb-28">
      <!-- Visitante -->
      <div>
        <label class="text-sm font-medium text-black dark:text-white">Visitante </label>
        <div class="relative">
          <div
            class="absolute left-3 top-1/2 flex h-8 w-8 -translate-y-1/2 items-center justify-center rounded-full bg-gray-200 dark:bg-gray-600"
          >
            <mat-icon class="text-black icon-size-5 dark:text-white"> person_outline </mat-icon>
          </div>
          <input
            [(ngModel)]="formCita.paciente"
            placeholder="Nombre completo"
            class="placeholder-primary-500 w-full rounded-2xl border border-gray-300 bg-gray-300 py-4 pl-12 pr-4 text-black outline-none transition-all focus:border-primary-500 focus:ring-1 focus:ring-primary-500 dark:bg-gray-500 dark:text-white"
          />
        </div>
      </div>

      <!-- Motivo -->
      <div>
        <label class="text-sm font-medium text-black dark:text-white">Motivo</label>
        <div class="relative">
          <div
            class="absolute left-3 top-1/2 flex h-8 w-8 -translate-y-1/2 items-center justify-center rounded-full bg-gray-200 dark:bg-gray-600"
          >
            <mat-icon
              class="text-black icon-size-5 dark:text-white"
              [svgIcon]="'heroicons_outline:assignment'"
            >
            </mat-icon>
          </div>
          <input
            [(ngModel)]="formCita.motivo"
            placeholder="Ej: Consulta general"
            class="placeholder-primary-500 w-full rounded-2xl border border-gray-300 bg-gray-300 py-4 pl-12 pr-4 text-black outline-none transition-all focus:border-primary-500 focus:ring-1 focus:ring-primary-500 dark:bg-gray-500 dark:text-white"
          />
        </div>
      </div>

      <!-- Fecha -->
      <div>
        <label class="text-sm font-medium text-black dark:text-white">Fecha</label>

        <div class="relative">
          <input
            #fechaInput
            type="date"
            [(ngModel)]="formCita.fecha"
            class="w-full rounded-2xl border border-gray-300 bg-gray-300 py-4 pl-4 pr-12 text-black outline-none transition-all focus:border-primary-500 focus:ring-1 focus:ring-primary-500 dark:bg-gray-500 dark:text-white [&::-webkit-calendar-picker-indicator]:hidden [&::-webkit-clear-button]:hidden"
          />

          <!-- Icono clicable -->
          <div
            (click)="fechaInput.showPicker()"
            class="absolute right-3 top-1/2 flex h-9 w-9 -translate-y-1/2 cursor-pointer items-center justify-center rounded-full bg-gray-200 transition-colors hover:bg-gray-300 dark:bg-gray-600 dark:hover:bg-gray-500"
          >
            <mat-icon class="text-black icon-size-5 dark:text-white"> calendar_today </mat-icon>
          </div>
        </div>
      </div>

      <!-- Hora Inicio y Fin -->
      <div class="grid grid-cols-2 gap-4">
        <!-- Hora Inicio -->
        <div>
          <label class="text-sm font-medium text-black dark:text-white">Inicio </label>

          <div class="relative">
            <input
              #horaInicioInput
              type="time"
              [(ngModel)]="formCita.horaInicio"
              class="w-full rounded-2xl border border-gray-300 bg-gray-300 py-4 pl-4 pr-14 text-black outline-none transition-all focus:border-primary-500 focus:ring-1 focus:ring-primary-500 dark:bg-gray-500 dark:text-white [&::-webkit-calendar-picker-indicator]:hidden [&::-webkit-clear-button]:hidden"
            />

            <div
              (click)="horaInicioInput.showPicker()"
              class="absolute right-3 top-1/2 flex h-8 w-8 -translate-y-1/2 cursor-pointer items-center justify-center rounded-full bg-gray-200 transition-colors hover:bg-gray-300 dark:bg-gray-600 dark:hover:bg-gray-500"
            >
              <mat-icon class="text-black icon-size-5 dark:text-white"> schedule </mat-icon>
            </div>
          </div>
        </div>

        <!-- Hora Fin -->
        <div>
          <label class="text-sm font-medium text-black dark:text-white">Fin</label>

          <div class="relative">
            <input
              #horaFinInput
              type="time"
              [(ngModel)]="formCita.horaFin"
              class="w-full rounded-2xl border border-gray-300 bg-gray-300 py-4 pl-4 pr-14 text-black outline-none transition-all focus:border-primary-500 focus:ring-1 focus:ring-primary-500 dark:bg-gray-500 dark:text-white [&::-webkit-calendar-picker-indicator]:hidden [&::-webkit-clear-button]:hidden"
            />

            <div
              (click)="horaFinInput.showPicker()"
              class="absolute right-3 top-1/2 flex h-8 w-8 -translate-y-1/2 cursor-pointer items-center justify-center rounded-full bg-gray-200 transition-colors hover:bg-gray-300 dark:bg-gray-600 dark:hover:bg-gray-500"
            >
              <mat-icon class="text-black icon-size-5 dark:text-white"> schedule </mat-icon>
            </div>
          </div>
        </div>
      </div>

      <!-- Estado -->
      <div>
        <label class="text-sm font-medium text-black dark:text-white">Estado</label>
        <div
          class="flex rounded-2xl border border-gray-700 bg-gray-300 p-1 text-black dark:border-gray-300 dark:bg-gray-500 dark:text-white"
        >
          <button
            *ngFor="let estado of ['confirmada', 'pendiente', 'cancelada']"
            (click)="formCita.estado = estado"
            class="flex-1 rounded-[14px] py-3 text-sm font-medium transition-all"
            [ngClass]="{
              'bg-green-500/50 text-black dark:text-white':
                formCita.estado === 'confirmada' && estado === 'confirmada',

              'bg-yellow-400/50 text-black dark:text-white':
                formCita.estado === 'pendiente' && estado === 'pendiente',

              'bg-red-500/50 text-white': formCita.estado === 'cancelada' && estado === 'cancelada',

              'text-gray-600 hover:bg-gray-200 dark:text-gray-300 dark:hover:bg-gray-700':
                formCita.estado !== estado,
            }"
          >
            {{ estado | titlecase }}
          </button>
        </div>
      </div>

      <!-- Notas -->
      <div>
        <label class="text-sm font-medium text-black dark:text-white">Notas / Observaciones</label>
        <textarea
          [(ngModel)]="formCita.notas"
          rows="4"
          placeholder="Añade observaciones..."
          class="w-full resize-none rounded-3xl border border-gray-300 bg-gray-300 p-4 text-black outline-none focus:border-primary-500 focus:ring-1 focus:ring-primary-500 dark:bg-gray-500 dark:text-white"
        ></textarea>
      </div>
    </div>

    <!-- Footer -->
    <div
      class="bg-default absolute bottom-0 left-0 right-0 border-t border-white/10 p-4 dark:bg-card"
    >
      <div class="flex gap-3">
        <button
          (click)="cerrarModal()"
          class="flex-1 rounded-2xl border border-gray-400 py-4 font-medium text-black transition-colors active:bg-white/5 dark:border-white/10 dark:text-white"
        >
          Cancelar
        </button>
        <button
          (click)="guardarCita()"
          class="flex flex-1 items-center justify-center gap-2 rounded-2xl bg-primary-600 py-4 font-semibold text-white transition-all hover:bg-primary-500 active:bg-primary-700"
        >
          <mat-icon class="text-white">{{ editandoCita ? 'sync' : 'add_circle_outline' }}</mat-icon>
          {{ editandoCita ? 'Actualizar' : 'Crear cita' }}
        </button>
      </div>
    </div>
  </div>
</div>
