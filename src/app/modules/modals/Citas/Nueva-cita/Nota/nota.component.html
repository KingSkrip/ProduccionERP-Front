<div class="bg-card w-full max-w-md rounded-2xl shadow-xl">

  <!-- Header -->
  <div class="flex items-center gap-3 border-b border-gray-200 px-5 py-3 dark:border-gray-600">
    <div class="flex h-10 w-10 items-center justify-center rounded-full bg-primary-100 dark:bg-primary-900">
      <mat-icon class="text-primary-600 dark:text-primary-400">info</mat-icon>
    </div>

    <h2 class="text-lg font-semibold text-black dark:text-white">
      Aviso importante
    </h2>
  </div>

  <!-- Body -->
  <div class="px-5 pb-3">
    <p class="text-sm leading-relaxed text-gray-700 dark:text-gray-300 whitespace-pre-line">
Toda persona que ingrese a las instalaciones deberá presentar una identificación oficial vigente.
El acceso con vehículo estará sujeto a la autorización de la Dirección, así como a la disponibilidad de espacios.
El ingreso se realiza por Avenida Las Partidas.
    </p>
  </div>

  <!-- Footer -->
  <div class="flex justify-end border-t border-gray-200 px-5 py-3 dark:border-gray-600">
    <button
      mat-flat-button
      color="primary"
      class="rounded-lg px-5"
      (click)="cerrar()"
    >
      Entendido
    </button>
  </div>

</div>
