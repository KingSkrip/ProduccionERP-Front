<!-- Desktop -->
<div
  class="fixed inset-0 z-50 hidden items-center justify-center bg-black/50 p-4 md:flex"
  (click)="onOverlayClick()">

  <div
    class="bg-card flex max-h-[90vh] w-full max-w-xs flex-col overflow-hidden rounded-2xl shadow-2xl"
    (click)="$event.stopPropagation()">

    <!-- header -->
    <div
      class="flex shrink-0 items-center justify-between border-b border-gray-200 px-5 py-4 dark:border-gray-700">
      <h2 class="text-lg font-bold text-black dark:text-white">Escanear
        rollo</h2>
      <button
        class="flex h-9 w-9 items-center justify-center rounded-full transition-colors hover:bg-gray-100 dark:hover:bg-gray-700"
        (click)="cerrar.emit()">
        <mat-icon class="text-black icon-size-5 dark:text-white"
          svgIcon="heroicons_outline:x-mark"></mat-icon>
      </button>
    </div>

    <div class="flex flex-1 flex-col items-center justify-center gap-3 p-5">
      <div
        class="relative aspect-square w-full max-w-[300px] overflow-hidden rounded-xl bg-black ">
        <app-lector-qr
          class="absolute inset-0 flex items-center justify-center [&_video]:h-full [&_video]:w-full [&_video]:object-cover"
          [bloqueado]="escaneando"
          (codigoDetectado)="onScanSuccess($event)">
        </app-lector-qr>

       @if (escaneando) {
        <div
          class="absolute inset-0 flex flex-col items-center justify-center gap-2 bg-black">
          <mat-progress-spinner mode="indeterminate" diameter="36"
            color="accent"></mat-progress-spinner>
          <span class="text-sm font-medium text-white">Buscando rollo…</span>
        </div>
        }
      </div>

      <p class="text-center text-xs text-black dark:text-white">
        Apunta la cámara al código del rollo
      </p>

      @if (errorEscaner) {
      <div
        class="w-full max-w-[300px] rounded-xl bg-red-50 px-4 py-3 text-center text-sm text-red-600 dark:bg-red-900/20 dark:text-red-400">
        {{ errorEscaner }}
      </div>
      }
    </div>

  </div>
</div>

<!-- Móvil: bottom sheet -->
<div
  class="fixed inset-0 z-50 flex items-end justify-center bg-black/50 md:hidden pb-9"
  (click)="onOverlayClick()">
  <div
    class="bg-card flex max-h-[92dvh] w-full max-w-md flex-col overflow-hidden rounded-t-3xl border border-gray-200 shadow-2xl"
    [class.select-none]="isDragging"
    [style.transform]="dragTransform"
    [style.transition]="dragTransition"
    (click)="$event.stopPropagation()"
    [@slideUp]>

    <div class="touch-none" (touchstart)="onTouchStart($event)"
      (touchmove)="onTouchMove($event)" (touchend)="onTouchEnd()">
      <div
        class="flex cursor-grab justify-center pb-2 pt-3 active:cursor-grabbing">
        <div
          class="h-1.5 w-11 rounded-full bg-primary-500 transition-colors active:bg-accent-500 "></div>
      </div>

      <div
        class="flex shrink-0 items-center justify-between border-b border-white/10 px-5">
        <h2 class="text-lg font-semibold text-black dark:text-white">
          Escanear rollo
        </h2>
        <button
          (click)="cerrar.emit()"
          class="flex h-9 w-9 items-center justify-center rounded-full text-primary-400 transition-colors hover:bg-white/10 hover:text-white">
          <mat-icon>close</mat-icon>
        </button>
      </div>
    </div>

    <div
      class="flex flex-1 flex-col items-center justify-center gap-3 p-5">
      <div class="relative aspect-square w-full max-w-[300px] overflow-hidden rounded-xl bg-black">
        <app-lector-qr
          class="absolute inset-0 flex items-center justify-center [&_video]:h-full [&_video]:w-full [&_video]:object-cover"
          [bloqueado]="escaneando"
          (codigoDetectado)="onScanSuccess($event)"></app-lector-qr>
        <!-- @if (escaneando) {
        <div
          class="absolute inset-0 flex flex-col items-center justify-center gap-2 bg-black/60">
          <mat-progress-spinner mode="indeterminate" diameter="36"
            color="accent"></mat-progress-spinner>
          <span class="text-sm font-medium text-white">Buscando rollo…</span>
        </div>
        } -->
      </div>
      <p class="text-center text-xs text-black dark:text-white">
        Apunta la cámara al código del rollo
      </p>
      @if (errorEscaner) {
      <div
        class="w-full max-w-[300px] rounded-xl bg-red-50 px-4 py-3 text-center text-sm text-red-600 dark:bg-red-900/20 dark:text-red-400">
        {{ errorEscaner }}
      </div>
      }
    </div>
  </div>
</div>
