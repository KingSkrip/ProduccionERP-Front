<!-- Navigation Sidebar DESKTOP-->
<fuse-vertical-navigation
  #reportProdNav
  name="reportProdNav"
  class="reportprod-nav bg-default w-64 shadow-lg md:w-72 print:hidden hidden lg:block"
  [appearance]="'default'"
  [mode]="isScreenSmall ? 'over' : 'side'"
  [navigation]="navigation"
  [opened]="isJacobo ? false : !isScreenSmall"
>
  <ng-container fuseVerticalNavigationContentHeader>
    <!-- Header -->
    <div class="mt-11 bg-primary px-5 py-5 md:mt-0 dark:bg-primary-700">
      <div class="flex items-center gap-3">
        <div class="flex h-9 w-9 items-center justify-center rounded-lg bg-white/20">
          <mat-icon class="!text-lg text-white" svgIcon="heroicons_outline:chart-bar"></mat-icon>
        </div>
        <h2 class="text-base font-medium text-white">Producción</h2>
      </div>

      <!-- Search bar -->
      <!-- <mat-form-field class="w-full !mb-3" appearance="outline">
        <mat-icon matPrefix class="!text-gray-400" svgIcon="heroicons_outline:magnifying-glass"></mat-icon>
        <input matInput placeholder="Buscar reportes...">
      </mat-form-field> -->
    </div>

    <!-- Label categorías -->
    <div class="border-b border-gray-100 px-5 py-2 dark:border-gray-800">
      <span class="text-[11px] font-semibold uppercase tracking-wider text-gray-400"
        >Categorías</span
      >
    </div>
  </ng-container>
</fuse-vertical-navigation>

<!-- ═══ MÓVIL: bottom nav custom ═══ -->
<div class="fixed bottom-10 left-0 right-0 z-50 lg:hidden print:hidden">
  <!-- Overlay para cerrar el menú radial -->
  <div
    *ngIf="mostrarMenuMas"
    class="fixed inset-0 z-40 bg-black/20 backdrop-blur-sm"
    (click)="mostrarMenuMas = false"
  ></div>

  <!-- Menú radial (items 4+) -->
  <div
    *ngIf="mostrarMenuMas && navigation.length > 4"
    class="absolute bottom-16 left-1/2 z-50 -translate-x-1/2"
  >
    <div class="relative flex items-end justify-center" style="width: 220px; height: 140px">
      <ng-container *ngFor="let item of navigation | slice: 4; let i = index">
        <button
          class="absolute flex flex-col items-center gap-1 transition-all duration-300"
          [style.left.px]="getFanX(i, (navigation | slice: 4).length)"
          [style.bottom.px]="getFanY(i, (navigation | slice: 4).length)"
          (click)="navegarA(item.link)"
        >
          <div
            class="flex h-11 w-11 items-center justify-center rounded-full shadow-lg"
            [ngClass]="
              isActiveRoute(item.link)
                ? 'bg-primary text-white'
                : 'bg-white text-black dark:bg-gray-800 dark:text-gray-300'
            "
          >
            <mat-icon
              class="!text-lg"
              [ngClass]="isActiveRoute(item.link) ? 'text-white' : 'text-black dark:text-white'"
              [svgIcon]="item.icon"
            ></mat-icon>
          </div>
          <span
            class="whitespace-nowrap rounded-full bg-white px-2 py-[2px] text-[9px] font-medium text-black shadow-sm dark:bg-gray-800/90 dark:text-gray-300"
          >
            {{ item.title | slice: 0 : 12 }}
          </span>
        </button>
      </ng-container>
    </div>
  </div>

  <!-- Barra principal -->
  <div
    class="relative flex items-center justify-around bg-white px-2 dark:bg-gray-900"
    style="height: 64px; border-top: 0.5px solid rgba(128, 128, 128, 0.15)"
  >

    <!-- navigation[1] y [2] → izquierda -->
<ng-container *ngFor="let item of navigation | slice: 1 : 3">
  <button
    class="flex flex-col items-center gap-[3px] px-3 transition-all duration-200 active:scale-95"
    (click)="navegarA(item.link)"
  >
    <mat-icon
      class="!text-[22px] transition-all duration-200"
      [ngClass]="
        isActiveRoute(item.link)
          ? 'text-primary scale-110'
          : 'text-gray-400 dark:text-gray-500'
      "
      [svgIcon]="item.icon"
    ></mat-icon>

    <span
      class="text-[10px] leading-none transition-all duration-200"
      [ngClass]="
        isActiveRoute(item.link)
          ? 'text-primary font-medium'
          : 'text-gray-400 dark:text-gray-500'
      "
    >
      {{ item.title }}
    </span>
  </button>
</ng-container>

    <!-- navigation[0] → burbuja centro -->
<button
  class="relative -mt-5 flex flex-col items-center gap-[3px] transition-all duration-200 active:scale-95"
  (click)="navegarA(navigation[0]?.link)"
>
  <div
    class="flex h-12 w-12 items-center justify-center rounded-full bg-primary shadow-lg ring-2 ring-white dark:ring-gray-900 transition-all duration-200"
    [ngClass]="
      isActiveRoute(navigation[0]?.link)
        ? 'scale-110'
        : 'opacity-90'
    "
  >
    <mat-icon
      class="!text-xl text-white transition-all duration-200"
      [ngClass]="
        isActiveRoute(navigation[0]?.link)
          ? 'scale-110'
          : ''
      "
      [svgIcon]="navigation[0]?.icon || 'heroicons_outline:home'"
    ></mat-icon>
  </div>

  <span
    class="text-[10px] leading-none transition-all duration-200"
    [ngClass]="
      isActiveRoute(navigation[0]?.link)
        ? 'text-primary font-semibold'
        : 'text-gray-400 dark:text-gray-500'
    "
  >
    {{ navigation[0]?.title }}
  </span>
</button>

    <!-- navigation[3] → derecha -->
<button
  *ngIf="navigation[3]"
  class="flex flex-col items-center gap-[3px] px-3 transition-all duration-200"
  (click)="navegarA(navigation[3].link)"
>
  <mat-icon
    class="!text-[22px] transition-all duration-200"
    [ngClass]="
      isActiveRoute(navigation[3].link)
        ? 'text-primary scale-110'
        : 'text-gray-400 dark:text-gray-500 scale-100'
    "
    [svgIcon]="navigation[3].icon"
  ></mat-icon>

  <span
    class="text-[10px] leading-none transition-all duration-200"
    [ngClass]="
      isActiveRoute(navigation[3].link)
        ? 'text-primary font-medium'
        : 'text-gray-400 dark:text-gray-500'
    "
  >
    {{ navigation[3].title }}
  </span>
</button>

    <!-- Botón Más -->
<button
  *ngIf="navigation.length > 4"
  class="flex flex-col items-center gap-[3px] px-3 transition-all duration-200 active:scale-95"
  (click)="toggleMenuMas()"
>
  <mat-icon
    class="!text-[22px] transition-all duration-300"
    [ngClass]="
      mostrarMenuMas
        ? 'text-primary scale-110 rotate-45'
        : 'text-gray-400 dark:text-gray-500'
    "
    svgIcon="heroicons_outline:plus"
  ></mat-icon>

  <span
    class="text-[10px] leading-none transition-all duration-200"
    [ngClass]="
      mostrarMenuMas
        ? 'text-primary font-medium'
        : 'text-gray-400 dark:text-gray-500'
    "
  >
    Más
  </span>
</button>
  </div>
</div>

<!-- CONTENIDO PRINCIPAL -->
<div class="flex w-full min-w-0 flex-auto flex-col">
  @if (isJacobo) {
    <div
      class="bg-card relative flex h-8 w-full flex-0 items-center justify-between border-b px-4 md:px-6 dark:bg-transparent print:hidden hidden md:block"
    >
      <div class="flex items-center gap-2">
        <button mat-icon-button (click)="toggleReportProdNav()" class="text-secondary">
          <mat-icon [svgIcon]="'heroicons_outline:bars-3'"></mat-icon>
        </button>
        <div class="hidden items-center gap-2 md:flex">
          <!-- aquí le mueves tú wey -->
          <mat-icon class="text-primary icon-size-5" svgIcon="heroicons_outline:home"></mat-icon>
          <span class="text-base font-bold">Panel de control</span>
        </div>
      </div>
    </div>
  } @else {
    <div
      class="bg-card relative flex h-16 w-full flex-0 items-center justify-between border-b px-4 md:px-6 dark:bg-transparent print:hidden hidden md:block"
    >
      <div class="flex items-center gap-2 ">
        <button mat-icon-button (click)="toggleReportProdNav()" class="text-secondary ">
          <mat-icon [svgIcon]="'heroicons_outline:bars-3'"></mat-icon>
        </button>
        <div class="hidden items-center gap-2 md:flex">
          <mat-icon class="text-primary icon-size-5" svgIcon="heroicons_outline:home"></mat-icon>
          <span class="text-base font-bold">Panel de control</span>
        </div>
      </div>
    </div>
  }

  <div class="flex min-w-0 flex-auto flex-col overflow-auto">
    <router-outlet></router-outlet>
  </div>
</div>
