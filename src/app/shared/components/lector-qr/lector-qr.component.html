<div class="flex flex-col items-center gap-3">
<div
  *ngIf="estado !== 'sin-camara' && estado !== 'error-camara'"
  class="lector-video-host relative aspect-square w-full max-w-[320px] overflow-hidden rounded-2xl bg-black ring-1 ring-white/10">
  <div [id]="lectorId" class="h-full w-full [&_video]:h-full [&_video]:w-full [&_video]:object-cover"></div>

    <!-- esquinas tipo "visor" -->
    <div class="pointer-events-none absolute inset-[14px]">
      <span
        class="absolute left-0 top-0 h-6 w-6 rounded-tl-lg border-l-[3px] border-t-[3px] border-emerald-400/90"
        [class.animate-pulse]="estado === 'escaneando'"></span>
      <span
        class="absolute right-0 top-0 h-6 w-6 rounded-tr-lg border-r-[3px] border-t-[3px] border-emerald-400/90"
        [class.animate-pulse]="estado === 'escaneando'"></span>
      <span
        class="absolute bottom-0 left-0 h-6 w-6 rounded-bl-lg border-b-[3px] border-l-[3px] border-emerald-400/90"
        [class.animate-pulse]="estado === 'escaneando'"></span>
      <span
        class="absolute bottom-0 right-0 h-6 w-6 rounded-br-lg border-b-[3px] border-r-[3px] border-emerald-400/90"
        [class.animate-pulse]="estado === 'escaneando'"></span>
    </div>

    <!-- línea de barrido mientras espera código -->
    <div
      *ngIf="estado === 'escaneando'"
      class="absolute left-[6%] right-[6%] h-0.5 animate-[barrido_2.4s_ease-in-out_infinite] bg-gradient-to-r from-transparent via-emerald-400 to-transparent shadow-[0_0_12px_1px_rgba(52,211,153,0.8)]"></div>

    <div
      *ngIf="estado === 'iniciando'"
      class="absolute inset-0 flex items-center justify-center bg-black/55 text-sm font-medium text-white">
      Iniciando cámara…
    </div>

    <div
      *ngIf="estado === 'procesando' || bloqueado"
      class="absolute inset-0 flex items-center justify-center gap-2 bg-black/55 text-sm font-medium text-white">
      <span
        class="h-4 w-4 animate-spin rounded-full border-2 border-white/25 border-t-white"></span>
      Verificando…
    </div>
  </div>

  <div *ngIf="estado === 'sin-camara' || estado === 'error-camara'"
    class="flex flex-col items-center gap-2 text-center">
    <mat-icon class="text-accent-500 icon-size-8"
      svgIcon="heroicons_outline:qr-code">
    </mat-icon>
    <p class="text-sm text-white">
      {{ estado === 'error-camara' ? mensajeError :
      'También puedes usar el lector USB.' }}
    </p>
    <button type="button" class="text-xs underline text-accent-500"
      (click)="reintentarCamara()">
      Reintentar cámara
    </button>
  </div>
</div>
