<div class="flex flex-col items-center gap-3">
  <div
    *ngIf="estado !== 'sin-camara' && estado !== 'error-camara'"
    class="relative aspect-square w-full max-w-[320px] overflow-hidden rounded-2xl bg-black">
    <div [id]="lectorId" class="h-full w-full"></div>

    <div
      *ngIf="estado === 'iniciando'"
      class="absolute inset-0 flex items-center justify-center bg-black/55 text-sm font-medium text-white">
      Iniciando cámara…
    </div>

    <div
      *ngIf="estado === 'procesando' || bloqueado"
      class="absolute inset-0 flex items-center justify-center gap-2 bg-black/55 text-sm font-medium text-white">
      <span class="h-4 w-4 animate-spin rounded-full border-2 border-white/25 border-t-white"></span>
      Verificando…
    </div>
  </div>

  <div *ngIf="estado === 'sin-camara' || estado === 'error-camara'" class="flex flex-col items-center gap-2 text-center">
    <mat-icon class="text-primary-500 icon-size-8" svgIcon="heroicons_outline:qr-code"></mat-icon>
    <p class="text-sm text-black dark:text-white">
      {{ estado === 'error-camara' ? mensajeError : 'También puedes usar el lector USB.' }}
    </p>
    <button type="button" class="text-xs underline" (click)="reintentarCamara()">
      Reintentar cámara
    </button>
  </div>

  <p class="text-center text-xs text-gray-500 dark:text-gray-400">
    Apunta la cámara al QR, o usa el lector USB — apunta y dispara
  </p>
</div>
